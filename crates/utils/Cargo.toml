[package]
name = "ellastic-utils"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
authors = ["playfairs"]
repository = "https://github.com/playfairs/ellastic"
homepage = "https://tiffiny.org"

[dependencies]
ellastic-errors = { path = "../errors" }
sha2 = "0.10"
md5 = "0.7"
blake3 = "1.5"
rand = { version = "0.8", features = ["small_rng"] }
rand_distr = "0.4"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.0", features = ["fs", "io-util", "time"] }
walkdir = "2.5"
tempfile = "3.12"
num_cpus = "1.16"
dirs = "5.0"
libc = "0.2"
tracing = { workspace = true }
