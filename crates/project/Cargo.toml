[package]
name = "ellastic-project"
version = "0.1.0"
edition = "2024"

authors = ["playfairs"]
description = "Project management for the Ellastic multimedia databending toolkit"
license = "GPL-3.0"
repository = "https://github.com/playfairs/ellastic"
homepage = "https://tiffiny.org"

[dependencies]
ellastic-errors = { path = "../errors" }
ellastic-core = { path = "../core" }
ellastic-utils = { path = "../utils" }
ellastic-image = { path = "../image" }
ellastic-audio = { path = "../audio" }
ellastic-media = { path = "../media" }
ellastic-glitch = { path = "../glitch" }
ellastic-effects = { path = "../effects" }
ellastic-pipeline = { path = "../pipeline" }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
