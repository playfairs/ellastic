[package]
name = "ellastic-ui"
version = "0.1.0"
edition = "2024"
authors = ["playfairs"]
description = "User interface for the Ellastic multimedia databending toolkit"
license = "GPL-3.0"
repository = "https://github.com/playfairs/ellastic"
homepage = "https://tiffiny.org"
keywords = ["ui", "interface", "egui", "multimedia", "databending"]
categories = [
  "gui",
  "multimedia",
  "graphics",
  "audio",
  "video",
  "development-tools",
]

[dependencies]
ellastic-errors = { path = "../errors" }
ellastic-core = { path = "../core" }
ellastic-utils = { path = "../utils" }
ellastic-bytes = { path = "../bytes" }
ellastic-image = { path = "../image" }
ellastic-audio = { path = "../audio" }
ellastic-media = { path = "../media" }
ellastic-glitch = { path = "../glitch" }
ellastic-effects = { path = "../effects" }
ellastic-pipeline = { path = "../pipeline" }
ellastic-project = { path = "../project" }
ellastic-export = { path = "../export" }
egui = "0.24"
eframe = "0.24"
egui_extras = "0.24"
egui_plot = "0.24"
egui_gizmo = { package = "egui-gizmo", version = "0.16" }
image = "0.24"
wgpu = "0.19"
winit = "0.28"
pollster = "0.3"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.8"
parking_lot = "0.12"
dashmap = "5.0"
crossbeam = "0.8"
futures = "0.3"
async-trait = "0.1"
log = "0.4"
tracing = "0.1"
thiserror = "1.0"
anyhow = "1.0"
notify = "6.0"
walkdir = "2.0"
glob = "0.3"
regex = "1.0"
rand = "0.8"
colorsys = "0.1"
palette = "0.7"
css-colors = "1.0"
strum = { version = "0.25", features = ["derive"] }
strum_macros = "0.25"
num-traits = "0.2"
itertools = "0.12"
once_cell = "1.19"
slotmap = "1.0"
smallvec = "1.11"
indexmap = "2.0"
hashbrown = "0.14"
bytemuck = "1.14"
glam = { version = "0.24", features = ["serde"] }
mint = "0.5"
nalgebra = { version = "0.32", features = ["serde-serialize"] }
unicode-segmentation = "1.10"
unicode-normalization = "0.1"
font-kit = "0.11"
rustybuzz = "0.12"
swash = "0.1"
usvg = "0.36"
resvg = "0.38"
tiny-skia = "0.11"
web-time = "0.2"
yew = { version = "0.21", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { version = "0.12", optional = true }
arboard = { version = "3.2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
console_log = { version = "1.0", optional = true }
gloo-net = { version = "0.4", optional = true }
gloo-storage = { version = "0.3", optional = true }

[features]
default = []
web = [
  "yew",
  "web-sys",
  "js-sys",
  "wasm-bindgen",
  "console_error_panic_hook",
  "console_log",
]
native = ["rfd", "arboard"]
