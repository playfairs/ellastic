[package]
name = "ellastic-app"
version = "0.1.0"
edition = "2024"
description = "Main application entrypoint for Ellastic multimedia databending toolkit"
license = "GPL-3.0"
authors = ["playfairs"]
repository = "https://github.com/playfairs/ellastic"
homepage = "https://tiffiny.org"
rust-version = "1.85.0"

[[bin]]
name = "ellastic"
path = "src/main.rs"

[dependencies]
ellastic-core = { path = "../core" }
ellastic-errors = { path = "../errors" }
ellastic-config = { path = "../config" }
ellastic-logging = { path = "../logging" }
ellastic-utils = { path = "../utils" }
ellastic-bytes = { path = "../bytes" }
ellastic-image = { path = "../image" }
ellastic-audio = { path = "../audio" }
ellastic-media = { path = "../media" }
ellastic-glitch = { path = "../glitch" }
ellastic-effects = { path = "../effects" }
ellastic-pipeline = { path = "../pipeline" }
ellastic-lua = { path = "../lua" }
ellastic-project = { path = "../project" }
ellastic-export = { path = "../export" }
ellastic-ui = { path = "../ui", optional = true }
ellastic-cli = { path = "../cli", optional = true }

tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
uuid = { version = "1.5", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.4", features = [
  "derive",
  "env",
  "color",
  "suggestions",
  "wrap_help",
] }
rayon = "1.8"
parking_lot = "0.12"
dashmap = "5.5"
log = "0.4"
env_logger = "0.10"

[features]
default = ["full"]
full = ["ui", "cli", "plugins"]
ui = ["ellastic-ui"]
cli = ["ellastic-cli"]
plugins = []
