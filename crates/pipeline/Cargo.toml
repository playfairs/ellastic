[package]
name = "ellastic-pipeline"
version = "0.1.0"
edition = "2024"
authors = ["playfairs"]
description = "Transformation pipeline and graph processing for the Ellastic multimedia databending toolkit"
license = "GPL-3.0"
repository = "https://github.com/playfairs/ellastic"
homepage = "https://tiffiny.org"
documentation = "https://docs.ellastic.dev"
keywords = ["multimedia", "pipeline", "graph", "transformations", "databending"]
categories = ["multimedia", "graphics", "audio", "video"]

[dependencies]
ellastic-errors = { path = "../errors" }
ellastic-utils = { path = "../utils" }
ellastic-bytes = { path = "../bytes" }
ellastic-image = { path = "../image" }
ellastic-audio = { path = "../audio" }
ellastic-media = { path = "../media" }
ellastic-glitch = { path = "../glitch" }
ellastic-effects = { path = "../effects" }
serde = { version = "1.0", features = ["derive"] }
rayon = "1.8"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
regex = "1.0"
log = "0.4"
tracing = "0.1"
thiserror = "1.0"
anyhow = "1.0"
parking_lot = "0.12"
dashmap = "5.0"
crossbeam = "0.8"
futures = "0.3"
async-trait = "0.1"
