[package]
name = "ellastic-export"
version = "0.1.0"
edition = "2024"
description = "Export and rendering system for the Ellastic multimedia databending toolkit"
license = "GPL-3.0"
authors = ["playfairs"]
repository = "https://github.com/playfairs/ellastic"
homepage = "https://tiffiny.org"
keywords = ["export", "rendering", "output", "multimedia", "databending"]
categories = ["multimedia", "graphics", "audio", "video", "development-tools"]

[dependencies]
ellastic-errors = { path = "../errors" }
ellastic-core = { path = "../core" }
ellastic-utils = { path = "../utils" }
ellastic-bytes = { path = "../bytes" }
ellastic-image = { path = "../image" }
ellastic-audio = { path = "../audio" }
ellastic-media = { path = "../media" }
ellastic-glitch = { path = "../glitch" }
ellastic-effects = { path = "../effects" }
ellastic-pipeline = { path = "../pipeline" }
ellastic-project = { path = "../project" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.8"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
regex = "1.0"
log = "0.4"
tracing = "0.1"
thiserror = "1.0"
anyhow = "1.0"
parking_lot = "0.12"
dashmap = "5.0"
crossbeam = "0.8"
futures = "0.3"
async-trait = "0.1"
image = "0.24"
imageproc = "0.23"
ffmpeg-next = "6.0"
mp4 = "0.14"
zip = "0.6"
tar = "0.4"
flate2 = "1.0"
sha2 = "0.10"
md5 = "0.7"
base64 = "0.21"
tempfile = "3.0"
notify = "6.0"
walkdir = "2.0"
pathdiff = "0.2"
glob = "0.3"
