[package]
name = "ellastic-lua"
version = "0.1.0"
edition = "2024"
description = "Lua scripting support for the Ellastic multimedia databending toolkit"
license = "GPL-3.0"
authors = ["playfairs"]
repository = "https://github.com/playfairs/ellastic"
homepage = "https://tiffiny.org"
keywords = ["lua", "scripting", "multimedia", "databending", "automation"]
categories = ["multimedia", "graphics", "audio", "video", "scripting"]

[dependencies]
ellastic-errors = { path = "../errors" }
ellastic-utils = { path = "../utils" }
ellastic-bytes = { path = "../bytes" }
ellastic-image = { path = "../image" }
ellastic-audio = { path = "../audio" }
ellastic-media = { path = "../media" }
ellastic-glitch = { path = "../glitch" }
ellastic-effects = { path = "../effects" }
ellastic-pipeline = { path = "../pipeline" }
serde = { version = "1.0", features = ["derive"] }
rayon = "1.8"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
regex = "1.0"
log = "0.4"
tracing = "0.1"
thiserror = "1.0"
anyhow = "1.0"
parking_lot = "0.12"
dashmap = "5.0"
crossbeam = "0.8"
futures = "0.3"
async-trait = "0.1"

# Lua bindings
mlua = { version = "0.9", features = [
  "lua54",
  "serialize",
  "macros",
  "async",
  "send",
] }
